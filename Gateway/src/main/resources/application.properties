server.port=8083
spring.application.name=GATEWAY
spring.security.enabled=false

# ----- Eureka Client -----
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ----- Gateway Discovery -----
spring.cloud.gateway.discovery.locator.enabled=false

# ===== ROUTES AVEC LOAD BALANCING =====

# 0. user-service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# 1. autorisation-service
spring.cloud.gateway.routes[1].id=autorisation-service
spring.cloud.gateway.routes[1].uri=lb://AUTORISATION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/autorisations/**

# 2. facturation-service
spring.cloud.gateway.routes[2].id=facturation-service
spring.cloud.gateway.routes[2].uri=lb://FACTURATION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/factures/**

# 3. reporting-service
spring.cloud.gateway.routes[3].id=reporting-service
spring.cloud.gateway.routes[3].uri=lb://REPORTING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/reports/**

# 4. client-service
spring.cloud.gateway.routes[4].id=client-service
spring.cloud.gateway.routes[4].uri=lb://CLIENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/clients/**

# 5. client-dashboard (même service que client-service)
spring.cloud.gateway.routes[5].id=client-dashboard
spring.cloud.gateway.routes[5].uri=lb://CLIENT-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/client/**

# 6. auth-service (si c'est un service distinct, sinon utilisez lb://USER-SERVICE)
spring.cloud.gateway.routes[6].id=auth-service
spring.cloud.gateway.routes[6].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/auth/**

# 7. formule-service (probablement facturation-service)
spring.cloud.gateway.routes[7].id=formule-service
spring.cloud.gateway.routes[7].uri=lb://FACTURATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/formules/**

# 8. forecast-service (service Python)
# Si ce service n'est PAS enregistré dans Eureka, gardez http://localhost:8000
# S'il est enregistré, remplacez par lb://FORECAST-SERVICE
spring.cloud.gateway.routes[8].id=forecast-service
spring.cloud.gateway.routes[8].uri=http://localhost:8000
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/forecast/**

# ----- Actuator -----
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true

# ----- Logs -----
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.netflix.discovery=DEBUG